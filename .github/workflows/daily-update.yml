name: Daily CFP update

on:
  schedule:
    # 00:07 UTC = 09:07 Korea Standard Time
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfp-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install updater dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python tests/test_parser.py

      - name: Check WikiCFP and official sites
        run: python scripts/update_conferences.py | tee update-output.json

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          echo '## Daily CFP update' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .update-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .update-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No update report was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push verified changes
        shell: bash
        run: |
          set -euo pipefail

          rm -f .update-report.json update-output.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # cfp.html itself is static; only the generated data needs daily commits.
          git add data.json data.js

          if git diff --cached --quiet; then
            echo "No conference-data changes."
            exit 0
          fi

          git commit -m "chore: update conference dates"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict: main changed the same generated data files."
              echo "Resolve the conflicting change manually, then run this workflow again."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Conference updates pushed successfully."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push was rejected three times because main kept changing."
              exit 1
            fi

            sleep $((attempt * 5))
          done
